# Gradle 运行参数
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 网络代理（本机 HTTP 代理），Maven 拉取依赖时需要
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890

# 环境版本：Minecraft 1.21.1 + NeoForge 21.1.x + Java 21
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.259
neo_version_range=[21.1.0,21.2)
# FML（javafml）加载器版本范围。NeoForge 21.x 对应 javafml 4.x，
# 注意不要误填成 NeoForge 的版本号，否则会报 "Missing language javafml"。
loader_version_range=[4,)

# 模组信息
mod_id=emerald_economy
mod_name=Emerald Economy
mod_license=All Rights Reserved
mod_version=1.0.2
mod_group_id=cn.daenx.mc.emeraldeconomy
mod_authors=DaenMax
mod_description=Emerald Economy - ATM, loans, funds, lottery, shop and acquisition systems powered by emeralds.
